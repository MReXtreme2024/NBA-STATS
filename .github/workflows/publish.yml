# Publishes the website whenever a change to it is pushed to main (the nightly update publishes too).
# Pushes made by the nightly job itself don't start this (GitHub doesn't chain its own pushes).
name: Publish site

on:
  push:
    branches: [main]
    paths: ['docs/**', '.github/workflows/publish.yml']

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: nightly
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Run tests
        run: node --test

      # Give the site's files a version tag in the published copy (not in the repo), so phones load new code
      # straight away instead of an old saved copy (21 Nov 2026).
      - name: Stamp file versions
        run: |
          v="${GITHUB_SHA::8}"
          sed -i -E "s#(href|src)=\"(style\.css|app\.js)\"#\1=\"\2?v=$v\"#" docs/index.html
          sed -i -E "s#from '\./([a-z]+\.js)'#from './\1?v=$v'#" docs/*.js

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - id: deploy
        uses: actions/deploy-pages@v4
