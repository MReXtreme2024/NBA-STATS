name: Nightly update

on:
  schedule:
    - cron: '7 0 * * *'                 # 12:07am: GitHub delays or drops jobs set for exactly the hour
      timezone: 'Australia/Melbourne'   # GitHub adjusts for daylight saving
  push:                                 # Claude starts an update by changing .github/run-update (Nate approved 8 Nov 2026)
    branches: [main]
    paths: ['.github/run-update']
  workflow_dispatch:                    # adds a "Run workflow" button for manual updates
    inputs:
      from:
        description: 'Optional: re-check every US date from this one (YYYY-MM-DD). Leave blank for a normal update.'
        required: false
        default: ''

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: nightly
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Run tests
        run: node --test

      - name: Fetch new games, rebuild and check
        env:
          FROM: ${{ inputs.from }}
        run: |
          if [ -n "$FROM" ]; then node updater/update.js --from "$FROM"; else node updater/update.js; fi

      - name: Save the new data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data docs/data
          git commit -m "Nightly update $(date -u +%Y-%m-%dT%H:%MZ)" || echo "Nothing to commit"
          git push

      # Give the site's files a version tag in the published copy (not in the repo), so phones load new code
      # straight away instead of an old saved copy (21 Nov 2026).
      - name: Stamp file versions
        run: |
          v="${GITHUB_SHA::8}"
          sed -i -E "s#(href|src)=\"(style\.css|app\.js)\"#\1=\"\2?v=$v\"#" docs/index.html
          sed -i -E "s#from '\./([a-z]+\.js)'#from './\1?v=$v'#" docs/*.js

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - id: deploy
        uses: actions/deploy-pages@v4
